works:

- title: "Bigger than Brexit? Estimating the impact of wildlife on resource use"
  pdflink: "/pdf/beavers.pdf"
  # coauthors: "John Conlon, Malavika Mani, Matthew Ridley and Frank Schilbach"
  # book: "Revised and Resubmitted, Econometrica"
  # note: "Current Version: October 2022"
  # links:
  #   - url: "https://www.socialscienceregistry.org/trials/4253"
  #     text: "Pre-Registration"
  links: 
      - url: "/pdf/gold_beavers_slides.pdf"
        text: "Slides"
  abstract: >
      Natural capital is widely understood to enter the production function. Ex-ante, agents may not know its effect on productivity, leading risk-averse operators to neutralize threats. In wildlife management, such action may reduce welfare if it degrades ecosystem functioning, reduces biodiversity, or eliminates beneficial services provided by culled animals. But there remains little empirical evidence on the effect of so-called "nuisance" species in the absence of control operations. The beaver, an ecosystem engineer that produces a host of well-documented benefits, can hinder agricultural productivity by inundating fields, grazing crops, felling trees, and collapsing flood banks. A recent unauthorized reemergence of beavers in Scotland, where they had been extinct for centuries, has triggered a backlash among agricultural producers. Using a series of regional beaver surveys and high-resolution land use data, I exploit the rapid recolonization to test whether beavers impede agricultural operation. Contrary to conventional wisdom, preliminary results indicate that, on the extensive margin, beaver entry increases land use for agriculture 4.6 p.p. (11% relative to baseline). This effect is driven by changes in directly exposed landscape patches with high agricultural soil suitability. To validate that beavers alter their physical environment, I employ a network of in-situ hydrometry monitoring stations to measure changes in river level and flow following beaver arrival but find inconclusive evidence. Ongoing analysis aims to clarify the mechanism of the reduced-form effect.
